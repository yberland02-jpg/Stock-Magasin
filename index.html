<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock magasin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mut:#64708a;--line:#d9dfe9;--main:#12305c;--warn:#b42318;--ok:#1d6b43}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
header{background:var(--main);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:19px;font-weight:600}
header small{opacity:.7;font-size:12px}
.bar{display:flex;gap:8px;padding:10px 12px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px;background:#fff;color:var(--ink)}
input,select{width:100%}
button{cursor:pointer;background:var(--main);color:#fff;border:0;font-weight:600}
button.sec{background:#fff;color:var(--main);border:1px solid var(--main)}
button.red{background:var(--warn)}
button.sm{padding:6px 10px;font-size:13px}
.item{background:var(--card);margin:0 12px 8px;padding:12px;border-radius:10px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:600}
.cat{color:var(--mut);font-size:12px}
.qty{font-weight:700;font-size:18px;white-space:nowrap}
.low{color:var(--warn)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--main);border-top:3px solid var(--main)}
.box{background:var(--card);margin:12px;padding:14px;border-radius:10px;border:1px solid var(--line)}
.kpi{display:flex;gap:10px;margin:12px}
.kpi div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:22px;color:var(--main)}
.kpi span{font-size:12px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal .in{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px;max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
video{width:100%;border-radius:10px;background:#000}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--main);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <div class="row"><h1>Stock magasin</h1><button class="sm sec" id="lock" onclick="adminToggle()">Administrateur</button></div>
  <small id="ver"></small> <small id="net"></small>
</header>
<div id="app"></div>
<nav>
  <button data-t="stock" onclick="go('stock')">Stock</button>
  <button data-t="sortie" onclick="go('sortie')">Sortie</button>
  <button data-t="histo" onclick="go('histo')">Historique</button>
</nav>
<div id="modal" onclick="if(event.target==this)closeM()"><div class="in" id="mc"></div></div>
<div id="toast"></div>
<script>
// ===== Configuration =====
const DB = "https://stock-consommables-default-rtdb.firebaseio.com"; // URL de la base Firebase (à vérifier)
const ROOT = "magasin";   // dossier séparé de l'atelier dans la base
const PIN = "1234";       // code administrateur (à changer)
const VERSION = "v1.6";
// =========================
let S = {items:{}, moves:{}, ops:{}}, admin = false, tab = 'stock', q = '', stream = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (p, m = 'GET', b) => fetch(`${DB}/${ROOT}/${p}.json`, {method:m, body:b === undefined ? undefined : JSON.stringify(b)}).then(r => { if(!r.ok) throw 0; return r.json(); });
const toast = t => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2200); };
const ini = () => localStorage.getItem('ini') || '';
$('ver').textContent = VERSION;

async function load(){
  try{ const d = await api(''); S.items = d?.items || {}; S.moves = d?.moves || {}; S.ops = d?.ops || {}; $('net').textContent = ''; render(); }
  catch(e){ $('net').textContent = '· hors ligne'; }
}
setInterval(() => { if($('modal').style.display !== 'flex') load(); }, 6000);

function go(t){ tab = t; stopCam(); render(); }
function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('lock').textContent = admin ? 'Quitter admin' : 'Administrateur';
  $('app').innerHTML = tab === 'stock' ? vStock() : tab === 'sortie' ? vSortie() : vHisto();
}
const list = () => Object.entries(S.items).map(([id, v]) => ({id, ...v})).sort((a, b) => (a.cat || '').localeCompare(b.cat || '') || a.name.localeCompare(b.name));
const monthKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const moves = () => Object.entries(S.moves).map(([id, v]) => ({id, ...v})).sort((a, b) => b.ts - a.ts);
const fdate = ts => new Date(ts).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});

function vStock(){
  const L = list(), low = L.filter(i => (i.min > 0 && i.qty <= i.min)).length;
  const mk = monthKey(Date.now()), out = moves().filter(m => m.type === 'sortie' && monthKey(m.ts) === mk).reduce((s, m) => s + m.qty, 0);
  const cats = [...new Set(L.map(i => i.cat).filter(Boolean))];
  const f = L.filter(i => (!window.fc || i.cat === window.fc) && (i.name + ' ' + (i.cat || '') + ' ' + (i.ref || '')).toLowerCase().includes(q.toLowerCase()));
  return `<div class="kpi"><div><b>${L.length}</b><span>références</span></div><div><b class="${low ? 'low' : ''}">${low}</b><span>sous le seuil</span></div><div><b>${out}</b><span>sorties ce mois</span></div></div>
  <div class="bar"><input placeholder="Rechercher" value="${esc(q)}" oninput="q=this.value;render();this.focus()"><select style="width:45%" onchange="window.fc=this.value;render()"><option value="">Toutes</option>${cats.map(c => `<option ${window.fc === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
  ${admin ? `<div class="bar"><button class="sm" onclick="editItem()">Nouvel article</button><button class="sm sec" onclick="order()">Commander</button><button class="sm sec" onclick="exportX()">Export Excel</button><button class="sm sec" onclick="importX()">Importer</button><button class="sm sec" onclick="loadCat()">Catalogue</button><button class="sm sec" onclick="cards()">Cartes</button></div>` : ''}
  ${f.map(i => `<div class="item"><div class="row"><div><div class="name">${esc(i.name)}</div><div class="cat">${esc(i.ref || '')}${i.cat ? ' · ' + esc(i.cat) : ''}${i.min ? ' · seuil ' + i.min : ''}</div></div><div class="qty ${(i.min > 0 && i.qty <= i.min) ? 'low' : ''}">${i.qty} ${esc(i.unit || '')}</div></div>
  <div class="acts"><button class="sm" onclick="needOp(() => sortie('${i.id}'))">Sortie</button>${admin ? `<button class="sm sec" onclick="entree('${i.id}')">Entrée</button><button class="sm sec" onclick="qr('${i.id}')">QR</button><button class="sm sec" onclick="editItem('${i.id}')">Modifier</button><button class="sm red" onclick="del('${i.id}')">Supprimer</button>` : ''}</div></div>`).join('') || '<div class="box">Aucun article.</div>'}`;
}

function vSortie(){
  const o = opActive();
  return `<div class="box"><b>Sortie de matière</b>${o
    ? `<p>Opérateur : <b>${esc(o.name)}</b> (${esc(o.ini)}) <button class="sm sec" onclick="SESSION = null; render()">Changer</button></p><p class="cat">${DOUCH ? 'Scannez l’article avec la douchette.' : 'Scannez l’étiquette de l’article.'}</p>${DOUCH ? '' : '<div class="acts"><button onclick="scanItem()">Scanner un article</button></div>'}`
    : `<p class="cat">${DOUCH ? 'Scannez votre carte avec la douchette, puis l’article.' : '1. Scannez votre carte. 2. Scannez l’article. 3. Indiquez la quantité.'}</p>${DOUCH ? '' : '<div class="acts"><button onclick="needOp(scanItem)">Scanner ma carte</button></div>'}`}
  <div class="acts" style="margin-top:12px"><button class="sm sec" onclick="setDouch(${DOUCH ? 0 : 1})">Lecteur : ${DOUCH ? 'douchette' : 'caméra'} (changer)</button></div></div>`;
}

function vHisto(){
  const M = moves(), mk = monthKey(Date.now());
  const by = {}; M.filter(m => m.type === 'sortie' && monthKey(m.ts) === mk).forEach(m => by[m.who] = (by[m.who] || 0) + m.qty);
  const tot = Object.values(by).reduce((a, b) => a + b, 0);
  return `<div class="box"><b>Sorties du mois : ${tot}</b><table>${Object.entries(by).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('') || '<tr><td>Aucune sortie</td></tr>'}</table></div>
  <div class="box"><table><tr><th>Date</th><th>Article</th><th>Qté</th><th>Qui</th></tr>${M.slice(0, 150).map(m => `<tr><td>${fdate(m.ts)}</td><td>${esc(m.name)}</td><td>${m.type === 'sortie' ? '-' : '+'}${m.qty}</td><td>${esc(m.who || '')}</td></tr>`).join('')}</table></div>`;
}

function openM(h){ $('mc').innerHTML = h; $('modal').style.display = 'flex'; }
function closeM(){ $('modal').style.display = 'none'; stopCam(); SCAN_CB = null; if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }

function sortie(id){
  const i = S.items[id]; if(!i) return toast('Article inconnu');
  openM(`<b>Sortie : ${esc(i.name)}</b><p class="cat">En stock : ${i.qty} ${esc(i.unit || '')}</p>
  <label>Quantité</label><input id="mq" type="number" min="1" value="1" inputmode="numeric">
  <p class="cat">Opérateur : <b>${esc(SESSION ? SESSION.name : '')}</b> (${esc(SESSION ? SESSION.ini : '')})</p>
  <div class="acts"><button onclick="doMove('${id}','sortie')">Valider la sortie</button><button class="sec" onclick="closeM()">Annuler</button></div>`);
  const qf = $('mq'); qf.focus(); qf.select(); qf.onkeydown = e => { if(e.key === 'Enter') doMove(id, 'sortie'); };
}
function entree(id){
  const i = S.items[id];
  openM(`<b>Entrée : ${esc(i.name)}</b><label>Quantité reçue</label><input id="mq" type="number" min="1" value="1" inputmode="numeric">
  <label>Initiales</label><input id="mi" maxlength="4" value="${esc(ini())}" style="text-transform:uppercase">
  <div class="acts"><button onclick="doMove('${id}','entree')">Valider l'entrée</button><button class="sec" onclick="closeM()">Annuler</button></div>`);
}
async function doMove(id, type){
  const o = type === 'sortie' ? opActive() : null;
  if(type === 'sortie' && !o){ closeM(); return toast('Session expirée : scannez votre carte'); }
  const n = parseInt($('mq').value), who = type === 'sortie' ? o.ini : $('mi').value.trim().toUpperCase();
  if(!n || n < 1) return toast('Quantité invalide');
  if(!who) return toast('Initiales obligatoires');
  try{
    const cur = await api(`items/${id}`); if(!cur) return toast('Article supprimé');
    if(type === 'sortie' && n > cur.qty) return toast('Stock insuffisant');
    const qty = cur.qty + (type === 'sortie' ? -n : n);
    await api(`items/${id}/qty`, 'PUT', qty);
    await api('moves', 'POST', {item:id, ref:cur.ref || '', name:cur.name, qty:n, who, op:o ? o.name : '', type, ts:Date.now()});
    localStorage.setItem('ini', who); if(o) SESSION.t = Date.now(); closeM(); toast('Enregistré'); load();
  }catch(e){ toast('Erreur réseau'); }
}

function editItem(id){
  const i = id ? S.items[id] : {ref:'', name:'', cat:'', qty:0, min:0, unit:''};
  openM(`<b>${id ? 'Modifier' : 'Nouvel'} article</b>
  <label>Référence</label><input id="er" value="${esc(i.ref)}"><label>Désignation</label><input id="en" value="${esc(i.name)}"><label>Catégorie</label><input id="ec" value="${esc(i.cat)}">
  <label>Quantité</label><input id="eq" type="number" value="${i.qty}"><label>Seuil d'alerte</label><input id="em" type="number" value="${i.min || 0}"><label>Conditionnement</label><input id="eu" value="${esc(i.unit)}">
  <div class="acts"><button onclick="saveItem('${id || ''}')">Enregistrer</button><button class="sec" onclick="closeM()">Annuler</button></div>`);
}
async function saveItem(id){
  const v = {ref:$('er').value.trim(), name:$('en').value.trim(), cat:$('ec').value.trim(), qty:parseInt($('eq').value) || 0, min:parseInt($('em').value) || 0, unit:$('eu').value.trim()};
  if(!v.name) return toast('Désignation requise');
  try{ if(id) await api(`items/${id}`, 'PUT', v); else await api('items', 'POST', v); closeM(); load(); }catch(e){ toast('Erreur réseau'); }
}
async function del(id){ if(!confirm('Supprimer cet article ?')) return; try{ await api(`items/${id}`, 'DELETE'); load(); }catch(e){ toast('Erreur réseau'); } }

function qr(id){
  const q = qrcode(0, 'M'); q.addData(id); q.make();
  openM(`<b>${esc(S.items[id].name)}</b><div style="text-align:center;margin:12px">${q.createSvgTag(6)}</div><p class="cat" style="text-align:center">Imprimez cette étiquette et collez-la sur l'emplacement.</p><div class="acts"><button class="sec" onclick="closeM()">Fermer</button></div>`);
}

function order(){
  const L = list().filter(i => (i.min > 0 && i.qty <= i.min));
  openM(`<b>À commander</b><table>${L.map(i => `<tr><td>${esc(i.ref || '')}<br>${esc(i.name)}</td><td>${i.qty} / ${i.min}</td></tr>`).join('') || '<tr><td>Rien à commander</td></tr>'}</table><div class="acts"><button class="sec" onclick="closeM()">Fermer</button></div>`);
}

function adminToggle(){
  if(admin){ admin = false; return render(); }
  const p = prompt('Code administrateur'); if(p === PIN){ admin = true; render(); } else if(p !== null) toast('Code incorrect');
}

// ===== Carte opérateur et scan =====
let SESSION = null, lastBad = 0, pendingKey = '', SCAN_CB = null, DOUCH = localStorage.getItem('douch') !== '0';
const SESSION_MS = 180000;
const key = c => String(c).trim().replace(/[.$#\[\]\/]/g, '_');
const opActive = () => SESSION && Date.now() - SESSION.t < SESSION_MS ? SESSION : null;
const bad = m => { if(Date.now() - lastBad > 2000){ lastBad = Date.now(); toast(m); } return false; };
const UNAZ = {'&':'1', 'é':'2', '"':'3', "'":'4', '(':'5', '-':'6', 'è':'7', '_':'8', 'ç':'9', 'à':'0'};
const findItem = raw => {
  const c = String(raw).trim(); if(S.items[c]) return c;
  const l = c.toLowerCase(); if(S.items[l]) return l;
  const u = l.replace(/[&é"'(\-è_çà]/g, ch => UNAZ[ch]); return S.items[u] ? u : null;
};
function scanPrompt(title, hint, cb, cancel, extra){
  const wrap = c => { const r = cb(c); if(r !== false && SCAN_CB === wrap) SCAN_CB = null; return r; };
  SCAN_CB = wrap;
  openM(`<b>${title}</b>${DOUCH ? '<p class="cat" style="margin:16px 0">Scannez avec la douchette.</p>' : '<video id="cam" playsinline muted style="margin-top:10px"></video>'}${hint ? `<p class="cat">${hint}</p>` : ''}${extra || ''}<div class="acts"><button class="sec" onclick="${cancel || 'closeM()'}">Annuler</button></div>`);
  if(!DOUCH) scanTo(wrap);
}
function setDouch(v){ DOUCH = !!v; localStorage.setItem('douch', v ? '1' : '0'); render(); }

async function scanTo(cb){
  const v = $('cam');
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}, height:{ideal:720}}});
    v.srcObject = stream; await v.play();
    const bd = window.BarcodeDetector ? new BarcodeDetector() : null;
    let zx = null;
    if(!bd && window.ZXing){
      const Z = window.ZXing, H = new Map();
      H.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.ITF, Z.BarcodeFormat.CODABAR]);
      H.set(Z.DecodeHintType.TRY_HARDER, true);
      zx = new Z.MultiFormatReader(); zx.setHints(H);
    }
    if(!bd && !zx) toast('Lecteur de code-barres indisponible : QR code seulement');
    const c = document.createElement('canvas'), x = c.getContext('2d', {willReadFrequently:true});
    const tick = async () => {
      if(!stream) return;
      if(v.videoWidth){
        let code = null;
        if(bd){ try{ const r = await bd.detect(v); if(r[0]) code = r[0].rawValue; }catch(e){} }
        if(!code){
          c.width = v.videoWidth; c.height = v.videoHeight; x.drawImage(v, 0, 0);
          if(zx){ try{ code = zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText(); }catch(e){} }
          if(!code){ const r = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height); if(r) code = r.data; }
        }
        if(code && cb(code) !== false) return;
      }
      if(zx) setTimeout(tick, 120); else requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ closeM(); toast('Caméra indisponible'); }
}
function stopCam(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }

function needOp(next){
  if(opActive()) return next();
  scanPrompt('Scannez votre carte', DOUCH ? '' : 'Présentez le code-barres de la carte à plat, bien éclairé.', code => {
    const o = S.ops[key(code)];
    if(!o) return bad('Carte inconnue : voir un administrateur');
    stopCam(); closeM(); SESSION = {name:o.name, ini:o.ini, t:Date.now()}; toast('Bonjour ' + o.name); next();
    return true;
  });
}
function scanItem(){
  scanPrompt('Scannez l’article', '', code => {
    const id = findItem(code);
    if(!id) return bad('Article inconnu');
    stopCam(); closeM(); sortie(id);
    return true;
  });
}

function cards(){
  const O = Object.values(S.ops);
  openM(`<b>Cartes enregistrées</b><table>${O.map((o, n) => `<tr><td>${esc(o.name)}</td><td>${esc(o.ini)}</td><td><button class="sm red" onclick="delCard(${n})">Retirer</button></td></tr>`).join('') || '<tr><td>Aucune carte</td></tr>'}</table>
  <div class="acts"><button onclick="addCard()">Ajouter une carte</button><button class="sec" onclick="closeM()">Fermer</button></div>`);
}
function addCard(){
  scanPrompt('Scannez la carte à enregistrer', 'Code-barres à plat, bien éclairé. Sinon, saisissez le numéro :', cardCode, 'cancelScan(); cards()',
    `<div class="row" style="margin-top:8px"><input id="mn" placeholder="Numéro de la carte"><button onclick="cardCode($('mn').value)">OK</button></div>`);
}
function cancelScan(){ stopCam(); SCAN_CB = null; }
function cardCode(code){
  code = String(code || '').trim(); if(!code) return false;
  const k = key(code); stopCam();
  if(S.ops[k]){ toast('Carte déjà enregistrée'); cards(); return true; }
  pendingKey = k;
  openM(`<b>Nouvelle carte</b><label>Nom et prénom</label><input id="on"><label>Initiales</label><input id="oi" maxlength="4" style="text-transform:uppercase">
  <div class="acts"><button onclick="saveCard()">Enregistrer</button><button class="sec" onclick="cards()">Annuler</button></div>`);
  return true;
}
async function saveCard(){
  const name = $('on').value.trim(), ini = $('oi').value.trim().toUpperCase();
  if(!name || !ini) return toast('Nom et initiales requis');
  try{ await api('ops/' + pendingKey, 'PUT', {name, ini}); await load(); cards(); }catch(e){ toast('Erreur réseau'); }
}
async function delCard(n){
  const k = Object.keys(S.ops)[n]; if(!k || !confirm('Retirer cette carte ?')) return;
  try{ await api('ops/' + k, 'DELETE'); await load(); cards(); }catch(e){ toast('Erreur réseau'); }
}

// ===== Douchette (lecteur USB ou Bluetooth en mode clavier) =====
let buf = '', lastT = 0, idleT = null;
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !(a.closest('#modal') && $('modal').style.display !== 'flex')) return;
  if(e.key === 'Enter' || e.key === 'Tab'){ if(buf.length >= 3){ e.preventDefault(); flushScan(); } else buf = ''; return; }
  if(e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;
  if(a && a.tagName === 'BUTTON') a.blur();
  const t = Date.now(); if(t - lastT > 100) buf = '';
  buf += e.key; lastT = t;
  clearTimeout(idleT); idleT = setTimeout(() => { if(buf.length >= 4) flushScan(); else buf = ''; }, 200);
});
function flushScan(){
  clearTimeout(idleT); const code = buf.trim(); buf = ''; if(!code) return;
  if(SCAN_CB) return void SCAN_CB(code);
  if($('modal').style.display === 'flex') return;
  const id = findItem(code), o = S.ops[key(code)];
  if(id) return needOp(() => sortie(id));
  if(o){ SESSION = {name:o.name, ini:o.ini, t:Date.now()}; toast('Bonjour ' + o.name); return go('sortie'); }
  bad('Code inconnu');
}

// ===== Excel =====
function exportX(){
  const L = list(), M = moves(), mk = monthKey(Date.now());
  const by = {}; M.filter(m => m.type === 'sortie').forEach(m => { const k = m.who + '|' + monthKey(m.ts); by[k] = (by[k] || 0) + m.qty; });
  const mo = M.filter(m => m.type === 'sortie' && monthKey(m.ts) === mk).reduce((s, m) => s + m.qty, 0);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Stock magasin'], ['Export du', new Date().toLocaleDateString('fr-FR')], ['Références', L.length], ['Sous le seuil', L.filter(i => (i.min > 0 && i.qty <= i.min)).length], ['Sorties du mois (tous opérateurs)', mo]]), 'Résumé');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(L.map(i => ({Référence:i.ref, Désignation:i.name, Catégorie:i.cat, Quantité:i.qty, Conditionnement:i.unit, Seuil:i.min}))), 'Stock');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(M.map(m => ({Date:fdate(m.ts), Type:m.type, Référence:m.ref || '', Article:m.name, Quantité:m.qty, Initiales:m.who, Nom:m.op || ''}))), 'Sorties');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(by).map(([k, v]) => { const [w, m] = k.split('|'); return {Initiales:w, Mois:m, 'Total sorti':v}; })), 'Opérateurs');
  XLSX.writeFile(wb, 'stock-magasin-export.xlsx');
}
function importX(){
  const f = document.createElement('input'); f.type = 'file'; f.accept = '.xlsx,.xls,.csv';
  f.onchange = async () => {
    const wb = XLSX.read(await f.files[0].arrayBuffer()), rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    const g = (r, ...k) => { for(const n of k){ const key = Object.keys(r).find(x => x.toLowerCase().startsWith(n)); if(key) return r[key]; } return ''; };
    const add = rows.map(r => ({ref:String(g(r, 'réf', 'ref')).trim(), name:String(g(r, 'désign', 'design', 'nom', 'article')).trim(), cat:String(g(r, 'cat')).trim(), qty:parseInt(g(r, 'quant', 'qt', 'stock')) || 0, min:parseInt(g(r, 'seuil', 'min')) || 0, unit:String(g(r, 'unit', 'condit')).trim()})).filter(r => r.name);
    if(!add.length || !confirm(`Importer ${add.length} articles ?`)) return;
    try{ for(const a of add) await api('items', 'POST', a); toast('Import terminé'); load(); }catch(e){ toast('Erreur réseau'); }
  };
  f.click();
}
